name: README Sync

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate README
        run: python3 scripts/generate_readme.py

      - name: Verify README is up to date
        run: git diff --exit-code README.md
